<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Navbar Search + Login</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
  </head>
  <body>

    <!-- Navbar -->
    <div class="p-3 d-flex align-items-center bg-dark text-white">

      <!-- Logo -->
      <div class="p-2 flex-grow-1 d-flex align-items-center">
        <img src=<img src="https://img.icons8.com/ios-filled/50/camera.png" alt="Camera"?semt=ais_hybrid&w=740&q=80
        "
     alt="Logo"
     style="height:40px; width:40px; border-radius:50%; object-fit:cover;"
     class="me-2">
        <span class="fw-bold p-2">kameraku</span>
      </div>

      <!-- Search -->
      <div class="p-2">
        <form class="d-flex" role="search">
          <input class="form-control me-2" type="search" placeholder="Cari..." aria-label="Search">
          <button class="btn btn-warning" type="submit">Cari</button>
        </form>
      </div>

      <!-- Login Button -->
      <div class="p-2">
        <a href="#" class="btn btn-outline-light">Login</a>
      </div>

    </div>

    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  </body>
</html>
